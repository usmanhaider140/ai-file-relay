[package]
name = "ai-file-relay-desktop"
description = "AI File Relay desktop app: the hub with the approval popup"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "ai_file_relay_desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
relay-core.workspace = true
relay-mcp = { path = "../../../crates/relay-mcp" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tokio-util = "0.7"
axum = "0.8"
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
