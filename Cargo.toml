[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Usman Haider"]
repository = "https://github.com/usmanhaider140/ai-file-relay"
homepage = "https://github.com/usmanhaider140/ai-file-relay"

[workspace.dependencies]
relay-protocol = { path = "crates/relay-protocol" }
relay-core = { path = "crates/relay-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
strip = true
