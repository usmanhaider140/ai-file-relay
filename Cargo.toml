[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
# The desktop app needs system WebView libraries to build, so plain `cargo`
# commands skip it. Build it with `cargo build -p ai-file-relay-desktop`.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["Usman Haider"]
repository = "https://github.com/usmanhaider140/ai-file-relay"
homepage = "https://github.com/usmanhaider140/ai-file-relay"
keywords = ["mcp", "ai", "browser", "file-upload", "chrome"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
relay-protocol = { package = "ai-file-relay-protocol", path = "crates/relay-protocol", version = "0.1.0" }
relay-core = { package = "ai-file-relay-core", path = "crates/relay-core", version = "0.1.0" }
relay-nmh = { package = "ai-file-relay-nmh", path = "crates/relay-nmh", version = "0.1.0" }
relay-mcp = { package = "ai-file-relay", path = "crates/relay-mcp", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
getrandom = "0.4"
toml = "1"
directories = "6"
ts-rs = "12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
strip = true
