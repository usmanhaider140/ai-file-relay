name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Generated TypeScript types are up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code apps/extension/src/generated

  extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: End to end (real Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build relay-mcp
        run: cargo build -p relay-mcp
      - name: Build the extension
        working-directory: apps/extension
        run: npm ci && npm run build
      # Branded Google Chrome ignores --load-extension, so use Chrome for Testing.
      - name: Install Chrome for Testing
        id: chrome
        run: |
          out=$(npx -y @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/browsers")
          echo "$out"
          echo "path=$(echo "$out" | tail -1 | cut -d' ' -f2-)" >> "$GITHUB_OUTPUT"
      - name: Run
        working-directory: tests/e2e
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: npm ci && npm test
