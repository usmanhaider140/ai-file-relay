name: Release

# Push a tag like v0.3.0 to build installers for macOS, Windows and Linux.
# They land in a draft GitHub release, so you can check them before
# publishing. Builds are not code-signed yet (see the README).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Install front-end packages
        working-directory: apps/desktop
        run: npm ci
      # Update files are signed with the key in the TAURI_SIGNING_PRIVATE_KEY
      # secret. Without it, the installers are still built, just without
      # auto-update files.
      - name: Signing for auto-update
        id: signing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "extra=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, so this release has no auto-update files."
            echo 'extra=--config {"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_OUTPUT"
          fi
      # tauri build runs `npm run sidecar && npm run build` first (see
      # tauri.conf.json), which builds relay-mcp for the same target.
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} ${{ steps.signing.outputs.extra }}
          includeUpdaterJson: true
          tagName: ${{ github.ref_name }}
          releaseName: AI File Relay ${{ github.ref_name }}
          releaseBody: |
            See the README for setup. Builds are not code-signed yet:
            on macOS, right-click the app and choose Open the first time;
            on Windows, choose More info → Run anyway.
          releaseDraft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  extension:
    name: Chrome extension zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build
        working-directory: apps/extension
        run: npm ci && npm run build
      - name: Zip
        run: cd apps/extension/dist && zip -r "$GITHUB_WORKSPACE/ai-file-relay-extension-${{ github.ref_name }}.zip" .
      - name: Attach to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: true
          files: ai-file-relay-extension-${{ github.ref_name }}.zip
