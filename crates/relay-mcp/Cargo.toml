[package]
name = "relay-mcp"
description = "MCP server for AI File Relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
relay-core.workspace = true
rmcp = { version = "3.11", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "fs", "io-std"] }
axum = "0.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
schemars = "1"
tokio-util = { version = "0.7", features = ["io"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "3.11", features = ["client"] }
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
