[package]
name = "relay-mcp"
description = "MCP server for AI File Relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
relay-core.workspace = true
relay-protocol.workspace = true
relay-nmh.workspace = true
directories.workspace = true
rmcp = { version = "3.11", features = ["server", "client", "macros", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "fs", "io-std", "io-util", "process", "time"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.28"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
schemars = "1"
tokio-util = { version = "0.7", features = ["io"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "3.11", features = ["client"] }
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
